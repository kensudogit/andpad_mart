# intra-mart ANDPAD プラグイン設定
app.imart.enabled=false
app.imart.plugin-id=andpad-api
app.imart.context-path=/andpad-imart

# intra-mart 認証・認可（LoginSessionManager / RoleInfoManager / WorkflowAuthUtil）
app.imart.auth.enabled=true
app.imart.auth.mode=stub
app.imart.auth.hybrid-with-jwt=true
app.imart.auth.session-cookie=imart-session
app.imart.auth.session-header=X-IM-Session-Id
app.imart.auth.dev-session-id=dev-imart-session
app.imart.auth.default-role-id=andpad-user
app.imart.auth.admin-role-id=andpad-admin
app.imart.auth.bridge.base-url=
app.imart.auth.bridge.invoke-path=/imart/api/andpad/ssjs-invoke

# メール送信（MailTemplateManager / MailTemplate / MailSender）
app.imart.mail.enabled=true
app.imart.mail.locale-id=ja
app.imart.mail.default-to=dev@andpad.local
app.imart.mail.file.enabled=true
app.imart.mail.file.path=/app/data/mail/messages.log
app.imart.mail.workflow.document-approval.submit-mail-id=andpad-doc-submit
app.imart.mail.workflow.document-approval.task-mail-id=andpad-doc-task
app.imart.mail.workflow.document-approval.approved-mail-id=andpad-doc-approved
app.imart.mail.workflow.document-approval.rejected-mail-id=andpad-doc-rejected
app.imart.mail.workflow.document-approval.returned-mail-id=andpad-doc-returned

# セッション（intra-mart 標準値に合わせる）
intramart.session.timeout=1800
intramart.db.schema=andpad_schema
