server:
  servlet:
    context-path: ${IMART_CONTEXT_PATH:/}

spring:
  application:
    name: andpad-imart-backend
  main:
    cloud-platform: NONE
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:false}
  config:
    import: optional:classpath:intramart.properties
  datasource:
    url: jdbc:postgresql://localhost:5435/andpad
    username: ${DB_USER:andpad}
    password: ${DB_PASSWORD:andpad}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
      initialization-fail-timeout: 60000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    connect-retries: ${SPRING_FLYWAY_CONNECT_RETRIES:3}
  graphql:
    path: /graphql
    graphiql:
      enabled: true
  servlet:
    multipart:
      max-file-size: 55MB
      max-request-size: 60MB

app:
  imart:
    enabled: false
    plugin-id: andpad-api
    context-path: /andpad-imart
    auth:
      enabled: ${IMART_AUTH_ENABLED:true}
      mode: ${IMART_AUTH_MODE:stub}
      hybrid-with-jwt: true
      dev-session-id: dev-imart-session
      session-cookie: imart-session
      session-header: X-IM-Session-Id
      default-role-id: andpad-user
      admin-role-id: andpad-admin
      bridge:
        base-url: ${IMART_BASE_URL:}
    mail:
      enabled: ${IMART_MAIL_ENABLED:true}
      locale-id: ${IMART_MAIL_LOCALE:ja}
      default-to: ${IMART_MAIL_DEFAULT_TO:dev@andpad.local}
      file:
        enabled: ${IMART_MAIL_FILE_ENABLED:true}
        path: ${IMART_MAIL_FILE_PATH:/app/data/mail/messages.log}
      store-in-database: ${IMART_MAIL_STORE_DB:true}
    monitoring:
      enabled: ${IMART_MONITORING_ENABLED:true}
      record-on-transition: ${IMART_MONITORING_RECORD:true}
      store-in-database: ${IMART_MONITORING_STORE_DB:true}
      flow-ids:
        - document-approval
      file:
        enabled: ${IMART_MONITORING_FILE_ENABLED:true}
        path: ${IMART_MONITORING_FILE_PATH:/app/data/monitoring/flow-data.log}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-in-production-min-32-chars}
    ttl-hours: 72
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  bim:
    upload-dir: ${BIM_UPLOAD_DIR:/app/data/bim-uploads}
    max-image-bytes: ${BIM_MAX_IMAGE_BYTES:5242880}
    max-model-bytes: ${BIM_MAX_MODEL_BYTES:52428800}
    store-in-database: ${BIM_STORE_IN_DATABASE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
