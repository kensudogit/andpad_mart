server:
  servlet:
    context-path: ${IMART_CONTEXT_PATH:/}

spring:
  application:
    name: andpad-imart-backend
  main:
    cloud-platform: NONE
  config:
    import: optional:classpath:intramart.properties
  datasource:
    url: jdbc:postgresql://localhost:5435/andpad
    username: ${DB_USER:andpad}
    password: ${DB_PASSWORD:andpad}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
      initialization-fail-timeout: 60000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  graphql:
    path: /graphql
    graphiql:
      enabled: true

app:
  imart:
    enabled: false
    plugin-id: andpad-api
    context-path: /andpad-imart
    auth:
      enabled: ${IMART_AUTH_ENABLED:false}
      mode: ${IMART_AUTH_MODE:stub}
      hybrid-with-jwt: true
      dev-session-id: dev-imart-session
      bridge:
        base-url: ${IMART_BASE_URL:}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-in-production-min-32-chars}
    ttl-hours: 72
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
