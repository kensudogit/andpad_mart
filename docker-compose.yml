# ANDPAD intra-mart — PostgreSQL + Spring Boot API + Next.js
# Web http://localhost:3003  API http://localhost:8084/graphql

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: andpad
      POSTGRES_PASSWORD: andpad
      POSTGRES_DB: andpad
    ports:
      - "5435:5432"
    volumes:
      - andpad_mart_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andpad -d andpad"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8084:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/andpad
      DB_USER: andpad
      DB_PASSWORD: andpad
      JWT_SECRET: dev-docker-jwt-secret-minimum-32-characters
      IMART_CONTEXT_PATH: /andpad-imart
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3003:3000"
    environment:
      API_URL: http://api:8080
    depends_on:
      - api

volumes:
  andpad_mart_pg:
